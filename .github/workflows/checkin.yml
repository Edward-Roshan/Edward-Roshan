name: checkin
on:
  #schedule:
  #  - cron: '7 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Run Glados Checkin
        env:
          GLADOS: ${{ secrets.GLADOS }}
        run: |
          node -e '
          const { chromium } = require("playwright");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

          function parseCookies(ckStr) {
            return ckStr.split(";").map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) {
              const i = p.indexOf("=");
              return {
                name: p.substring(0, i).trim(),
                value: p.substring(i + 1).trim(),
                domain: "glados.cloud",
                path: "/",
                secure: true,
                sameSite: "Lax"
              };
            });
          }

          // 失败时：抓取页面快照用于诊断（URL / 标题 / ckb 按钮是否存在 / 可见文本片段）
          async function diagnose(page) {
            try {
              const info = await page.evaluate(function () {
                const ckb = document.querySelector("button.ckb");
                return {
                  url: location.href,
                  title: document.title,
                  hasCkb: !!ckb,
                  ckbDisabled: ckb ? ckb.disabled : null,
                  bodyText: (document.body ? document.body.innerText : "").replace(/\s+/g, " ").slice(0, 600)
                };
              });
              return info;
            } catch (e) { return { evalError: e.message }; }
          }

          // 兜底：页面内直接复刻浏览器 checkin 请求（继承 cookie + 同源 fetch，仍用当前前端常量 glados-observer-v1）
          async function fallbackCheckin(page) {
            return await page.evaluate(async function () {
              try {
                const ch = await (await fetch("/api/user/checkin/challenge")).json();
                if (ch.code) return { __err: "challenge 失败: " + (ch.message || ch.code) };
                const nonce = ch.nonce;
                await new Promise(function (r) { setTimeout(r, 2600); }); // 复刻 solveChallenge 的 2.5s 等待
                const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(nonce + ".glados-observer-v1"));
                const proof = Array.from(new Uint8Array(buf)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
                const r = await fetch("/api/user/checkin", {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify({ token: location.hostname, nonce: nonce, proof: proof })
                });
                return await r.json();
              } catch (e) { return { __err: String(e) }; }
            });
          }

          (async () => {
            const cookieLines = String(process.env.GLADOS || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
            if (cookieLines.length === 0) throw new Error("GLADOS 环境变量未设置或为空");

            const results = [];
            for (const ck of cookieLines) {
              const masked = ck.substring(0, 20) + "...";
              let browser;
              try {
                browser = await chromium.launch({
                  headless: true,
                  args: ["--disable-blink-features=AutomationControlled", "--no-sandbox"]
                });
                const context = await browser.newContext({ userAgent: UA, viewport: { width: 1280, height: 800 } });
                await context.addCookies(parseCookies(ck));
                const page = await context.newPage();
                await page.addInitScript(function () {
                  try { Object.defineProperty(navigator, "webdriver", { get: function () { return false; } }); } catch (e) {}
                });

                let apiResult = null;
                page.on("response", async function (resp) {
                  const u = resp.url();
                  if (u.includes("/api/user/checkin") && !u.includes("challenge")) {
                    try { apiResult = await resp.json(); } catch (e) {}
                  }
                });

                await page.goto("https://glados.cloud/console/checkin", { waitUntil: "networkidle", timeout: 60000 });

                // 诊断：若被重定向到登录页，说明 cookie 没生效
                if (!page.url().includes("/console/checkin")) {
                  const d = await diagnose(page);
                  throw new Error("页面被重定向（cookie 可能失效）: " + JSON.stringify(d));
                }

                let usedFallback = false;
                try {
                  await page.waitForSelector("button.ckb", { state: "visible", timeout: 30000 });
                  await page.click("button.ckb");
                } catch (e) {
                  console.log("[WARN] 未找到/无法点击 button.ckb，改用页内 fetch 复刻: " + e.message);
                  const fr = await fallbackCheckin(page);
                  if (fr && !fr.__err) { apiResult = fr; usedFallback = true; }
                  else { const d = await diagnose(page); throw new Error("button.ckb 缺失且无兜底结果: " + JSON.stringify(fr || d)); }
                }

                for (let i = 0; i < 60 && !apiResult; i++) await page.waitForTimeout(250);
                if (!apiResult) {
                  const d = await diagnose(page);
                  throw new Error("未捕获到 /api/user/checkin 响应: " + JSON.stringify(d));
                }
                if (apiResult.__err) throw new Error("兜底请求异常: " + apiResult.__err);
                // code 0 = 成功签到；code 1 = 今日已签到(repeated)，同样视为成功
                if (apiResult.code && apiResult.code !== 1) {
                  throw new Error("checkin 失败: " + (apiResult.message || "unknown") + " (code " + apiResult.code + (apiResult.reason ? ", reason " + apiResult.reason : "") + ")");
                }

                const leftDays = await page.evaluate(async function () {
                  try { const r = await fetch("/api/user/status"); const j = await r.json(); return j && j.data ? Number(j.data.leftDays) : null; } catch (e) { return null; }
                });

                const ok = apiResult.code === 1;
                results.push({
                  cookie: masked, ok: true, repeated: ok,
                  message: apiResult.message, points: apiResult.points,
                  streak: apiResult.streak, leftDays: leftDays, via: usedFallback ? "fallback-fetch" : "button-click"
                });
                console.log("[OK] " + masked + " -> " + JSON.stringify({ message: apiResult.message, points: apiResult.points, leftDays: leftDays, via: usedFallback ? "fallback" : "button" }));
              } catch (e) {
                results.push({ cookie: masked, ok: false, error: e.message });
                console.log("[FAIL] " + masked + " -> " + e.message);
              } finally {
                if (browser) await browser.close();
              }
            }

            console.log("==== 汇总 ====");
            console.log(JSON.stringify(results, null, 2));
            if (results.some(function (r) { return !r.ok; })) process.exit(1);
          })().catch(function (e) {
            console.error("Fatal error:", e.message);
            process.exit(1);
          });
          '
