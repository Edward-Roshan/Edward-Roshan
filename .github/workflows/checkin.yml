name: checkin
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Run Glados Checkin
        env:
          GLADOS: ${{ secrets.GLADOS }}
        run: |
          node -e '
          const { chromium } = require("playwright");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

          function parseCookies(ckStr) {
            return ckStr.split(";").map(function (p) { return p.trim(); }).filter(Boolean).map(function (p) {
              const i = p.indexOf("=");
              return { name: p.substring(0, i).trim(), value: p.substring(i + 1).trim(), domain: "glados.cloud", path: "/" };
            });
          }

          (async () => {
            const cookieLines = String(process.env.GLADOS || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
            if (cookieLines.length === 0) throw new Error("GLADOS 环境变量未设置或为空");

            const results = [];
            for (const ck of cookieLines) {
              const masked = ck.substring(0, 20) + "...";
              let browser;
              try {
                browser = await chromium.launch({
                  headless: true,
                  args: ["--disable-blink-features=AutomationControlled", "--no-sandbox"],
                });
                const context = await browser.newContext({ userAgent: UA, viewport: { width: 1280, height: 800 } });
                await context.addCookies(parseCookies(ck));
                const page = await context.newPage();
                await page.addInitScript(function () {
                  try { Object.defineProperty(navigator, "webdriver", { get: function () { return false; } }); } catch (e) {}
                });

                let apiResult = null;
                page.on("response", async function (resp) {
                  const u = resp.url();
                  if (u.includes("/api/user/checkin") && !u.includes("challenge")) {
                    try { apiResult = await resp.json(); } catch (e) {}
                  }
                });

                await page.goto("https://glados.cloud/console/checkin", { waitUntil: "domcontentloaded", timeout: 30000 });
                await page.waitForSelector("button", { timeout: 20000 });

                const clicked = await page.evaluate(function () {
                  const btns = Array.from(document.querySelectorAll("button"));
                  let target = btns.find(function (b) { return /check\s*in|签到|sign\s*in|checkin/i.test((b.innerText || "").toLowerCase()); });
                  if (!target) target = btns.find(function (b) { return (b.innerText || "").trim().length > 0; });
                  if (target) { target.click(); return true; }
                  return false;
                });
                if (!clicked) throw new Error("未在页面找到签到按钮");

                for (let i = 0; i < 40 && !apiResult; i++) await page.waitForTimeout(250);
                if (!apiResult) throw new Error("未捕获到 /api/user/checkin 响应");
                if (apiResult.code) throw new Error("checkin 失败: " + (apiResult.message || "unknown") + " (code " + apiResult.code + ")");

                const leftDays = await page.evaluate(async function () {
                  try { const r = await fetch("/api/user/status"); const j = await r.json(); return j && j.data ? Number(j.data.leftDays) : null; } catch (e) { return null; }
                });

                results.push({ cookie: masked, ok: true, message: apiResult.message, points: apiResult.points, streak: apiResult.streak, leftDays: leftDays });
                console.log("[OK] " + masked + " -> " + JSON.stringify({ message: apiResult.message, points: apiResult.points, leftDays: leftDays }));
              } catch (e) {
                results.push({ cookie: masked, ok: false, error: e.message });
                console.log("[FAIL] " + masked + " -> " + e.message);
              } finally {
                if (browser) await browser.close();
              }
            }

            console.log("==== 汇总 ====");
            console.log(JSON.stringify(results, null, 2));
            if (results.some(function (r) { return !r.ok; })) process.exit(1);
          })().catch(function (e) {
            console.error("Fatal error:", e.message);
            process.exit(1);
          });
          '
